<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS SAP Exam - HTML 导航</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --paper: #fff;
      --ink: #172033;
      --muted: #627089;
      --line: #e3e9f2;
      --blue: #2457c5;
      --blue-soft: #eaf1ff;
      --shadow: 0 8px 28px rgba(25, 45, 85, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      padding: 54px 22px 48px;
      color: #fff;
      background: linear-gradient(120deg, #10264d, #2457c5);
    }
    .hero, main { max-width: 1120px; margin: 0 auto; }
    .eyebrow { font-size: 13px; letter-spacing: .12em; opacity: .8; }
    h1 { margin: 12px 0 8px; font-size: clamp(30px, 5vw, 44px); line-height: 1.2; }
    .intro { max-width: 700px; margin: 0; color: #e4ecff; }
    main { padding: 28px 18px 64px; }
    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .list-heading h2 { margin: 0; font-size: 20px; }
    .count {
      margin: 0;
      padding: 5px 12px;
      border: 1px solid #d5e2ff;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }
    .file-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .file-card { min-width: 0; }
    .file-link {
      display: flex;
      min-height: 112px;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .file-link:hover {
      transform: translateY(-3px);
      border-color: #b7cbf7;
      box-shadow: 0 14px 32px rgba(25, 45, 85, .12);
    }
    .file-link:focus-visible { outline: 3px solid #8eb3ff; outline-offset: 3px; }
    .file-icon {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border-radius: 12px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 13px;
      font-weight: 750;
    }
    .file-info { min-width: 0; }
    .file-name {
      display: block;
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.45;
    }
    .file-path {
      display: block;
      margin-top: 5px;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
    }
    .file-arrow { margin-left: auto; color: #8a9ab4; font-size: 20px; }
    .empty-state, .error-state {
      grid-column: 1 / -1;
      padding: 28px;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      background: rgba(255, 255, 255, .7);
      color: var(--muted);
      text-align: center;
    }
    footer { padding: 0 18px 28px; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 600px) {
      header { padding: 40px 20px 36px; }
      main { padding-top: 22px; }
      .file-list { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hero">
      <div class="eyebrow">AWS CERTIFIED SOLUTIONS ARCHITECT · PROFESSIONAL</div>
      <h1>AWS SAP Exam 学习资料</h1>
      <p class="intro">集中浏览架构笔记、服务考点与复习手册，选择卡片即可在新标签页中打开。</p>
    </div>
  </header>
  <main>
    <div class="list-heading">
      <h2>学习资料</h2>
      <p class="count" id="file-count" aria-live="polite"></p>
    </div>
    <ul class="file-list" id="file-list"></ul>
  </main>
  <footer>AWS Solutions Architect Professional · Study Library</footer>
  <script src="html-files.js"></script>
  <script>
    const files = window.HTML_FILES;
    const fileList = document.getElementById("file-list");
    const fileCount = document.getElementById("file-count");

    if (!Array.isArray(files)) {
      fileCount.textContent = "加载失败";
      const errorItem = document.createElement("li");
      errorItem.className = "error-state";
      errorItem.textContent = "无法加载导航数据，请重新运行 tools/generate_index.py";
      fileList.appendChild(errorItem);
      throw new Error("html-files.js did not provide an HTML file list");
    }

    fileCount.textContent = `共 ${files.length} 个 HTML 文件`;
    if (files.length === 0) {
      const emptyItem = document.createElement("li");
      emptyItem.className = "empty-state";
      emptyItem.textContent = "暂无 HTML 文件";
      fileList.appendChild(emptyItem);
    } else {
      for (const file of files) {
        const item = document.createElement("li");
        item.className = "file-card";
        const link = document.createElement("a");
        link.className = "file-link";
        link.href = file.split("/").map(encodeURIComponent).join("/");
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        const icon = document.createElement("span");
        icon.className = "file-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "HTML";
        const info = document.createElement("span");
        info.className = "file-info";
        const name = document.createElement("span");
        name.className = "file-name";
        name.textContent = file.split("/").pop();
        const path = document.createElement("span");
        path.className = "file-path";
        path.textContent = file;
        const arrow = document.createElement("span");
        arrow.className = "file-arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "›";
        info.append(name, path);
        link.append(icon, info, arrow);
        item.appendChild(link);
        fileList.appendChild(item);
      }
    }
  </script>
</body>
</html>
